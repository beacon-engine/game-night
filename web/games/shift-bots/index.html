<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Bots · Beacon Arcade</title>
<link rel="icon" href="/brand/mark.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* ---- lobby: a bot on the plinth behind ---- */
  #lobby { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(400px, 36%) 1fr; }
  #lobby .side { display: flex; flex-direction: column; gap: 22px; padding: 32px 40px; background: rgb(7 8 11 / 0.92); border-right: 1px solid var(--line); overflow-y: auto; }
  #lobby .back { align-self: flex-start; }
  #players { display: flex; flex-direction: column; gap: 8px; }
  .player { display: flex; align-items: center; gap: 12px; }
  #settings { display: flex; flex-direction: column; }
  .setting { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-left: 3px solid transparent;
    font: 700 22px/1 var(--font-display); text-transform: uppercase; color: var(--chalk-2); }
  .setting.sel { background: var(--ink-2); border-left-color: var(--volt); color: var(--chalk); }
  .setting .value { display: flex; align-items: center; gap: 10px; }
  .setting .value b { min-width: 7em; text-align: center; color: var(--chalk); }
  .setting:not(.sel) .glyph { visibility: hidden; }
  #lobby .join { display: flex; gap: 14px; align-items: center; padding: 12px; margin-top: auto; }
  #lobby .join .qr { width: 88px; height: 88px; padding: 5px; }
  #lobby .join .url { font: 600 13px/1.3 var(--font-ui); word-break: break-all; margin-top: 4px; }

  /* ---- garage: a card over each person's bay (the screen splits for 2 to 4) ---- */
  #garage { position: fixed; inset: 0; pointer-events: none; }
  .bay { position: absolute; box-shadow: inset 0 0 0 1px var(--ink-0); }
  .card { position: absolute; left: 24px; top: 24px; bottom: 24px; width: min(380px, 40%); display: flex; flex-direction: column; gap: 10px; padding: 18px 20px;
    background: rgb(14 16 22 / 0.9); overflow: hidden; }
  .card .head { display: flex; justify-content: space-between; align-items: center; }
  .card h2 { margin: 0; font: 900 46px/0.95 var(--font-display); text-transform: uppercase; }
  .card .about { margin: 0; font-size: 14px; min-height: 2.6em; }
  .card .credit { margin: auto 0 0; font-size: 11px; }
  .stats { display: flex; flex-direction: column; gap: 6px; }
  .stat { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 10px; font: 600 11px/1 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--chalk-2); }
  .stat i { height: 6px; background: var(--ink-3); border-radius: 3px; overflow: hidden; }
  .stat b { display: block; height: 100%; background: var(--chalk); }
  .rows { display: flex; flex-direction: column; margin-top: 4px; }
  .row { display: grid; grid-template-columns: 76px 1fr; align-items: center; padding: 7px 10px; border-left: 3px solid transparent; color: var(--chalk-2); }
  .row.sel { background: var(--ink-2); border-left-color: var(--volt); color: var(--chalk); }
  .row .k { font: 700 13px/1 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; }
  .row .v { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row .v b { font: 800 19px/1 var(--font-display); text-transform: uppercase; color: var(--chalk); text-align: center; flex: 1; }
  .row:not(.sel) .glyph { visibility: hidden; }
  .row .swatches { grid-column: 2; display: flex; gap: 3px; margin-top: 7px; }
  .row:not(.sel) .swatches { display: none; }
  .row .more { grid-column: 2; font-size: 11px; margin-top: 5px; }
  .row:not(.sel) .more { display: none; }
  .swatches i { flex: 1; height: 14px; border-radius: 2px; border: 1px solid var(--line); }
  .swatches i.on { outline: 2px solid var(--volt); outline-offset: 1px; }
  .ready { font: 800 16px/1 var(--font-display); text-transform: uppercase; color: var(--chalk-2); display: flex; align-items: center; gap: 6px; }
  .ready.on { color: var(--volt); }
  .card.small { left: 12px; top: 12px; bottom: 12px; padding: 12px 14px; gap: 6px; width: min(300px, 44%); }
  .card.small h2 { font-size: 30px; }
  .card.small .stats, .card.small .about, .card.small .credit { display: none; }
  .card.small .row { padding: 4px 8px; }
  .card.small .row .v b { font-size: 15px; }

  /* ---- the fight: a box per view (the screen splits for 2 to 4) ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud .view { position: absolute; box-shadow: inset 0 0 0 1px var(--ink-0); }
  #hud .me { position: absolute; left: 18px; top: 16px; display: flex; align-items: center; gap: 10px; }
  #hud .mode { font: 800 20px/1 var(--font-display); text-transform: uppercase; text-shadow: 0 2px 10px rgb(7 8 11 / 0.8); }
  #hud .bars { position: absolute; left: 18px; bottom: 18px; width: min(320px, 40%); display: flex; flex-direction: column; gap: 6px; }
  #hud .bar { height: 12px; background: rgb(14 16 22 / 0.75); border-radius: 3px; overflow: hidden; }
  #hud .bar b { display: block; height: 100%; background: var(--chalk); transition: width 120ms var(--ease); }
  #hud .bar.low b { background: #ff4433; }
  #hud .bar.boost { height: 6px; }
  #hud .bar.boost b { background: #ff9a3d; }
  #hud .bar.special { position: relative; height: 16px; }
  #hud .bar.special b { background: var(--ink-3); }
  #hud .bar.special.full b { background: var(--star); }
  #hud .bar.special span { position: absolute; left: 8px; top: 2px; font: 700 11px/12px var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; }
  #hud .downed { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); padding: 8px 14px; border-radius: var(--r-2); background: rgb(14 16 22 / 0.85);
    font: 800 22px/1 var(--font-display); text-transform: uppercase; white-space: nowrap; }
  #boss { position: fixed; left: 50%; top: 62px; transform: translateX(-50%); width: min(560px, 60vw); display: flex; flex-direction: column; gap: 4px; align-items: center;
    font: 800 16px/1 var(--font-display); text-transform: uppercase; text-shadow: 0 2px 10px rgb(7 8 11 / 0.8); }
  #boss i { width: 100%; height: 12px; background: rgb(14 16 22 / 0.8); border-radius: 3px; overflow: hidden; }
  #boss b { display: block; height: 100%; background: #ff3b30; }
  /* ---- between waves: a shop card over each view ---- */
  #shop { position: fixed; inset: 0; pointer-events: none; }
  #shopTime { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); font: 800 22px/1 var(--font-display); text-shadow: 0 2px 10px rgb(7 8 11 / 0.8); }
  .card.shop { bottom: auto; background: rgb(14 16 22 / 0.97); }
  .card.shop .row { grid-template-columns: 1fr 50px; }
  .card.shop .row .about { grid-column: 1 / -1; font-size: 11px; margin-top: 3px; }
  .card.shop .row.dim .v b { color: var(--chalk-3); }
  #hud .radar { position: absolute; right: 14px; bottom: 36px; width: min(200px, 26vh); height: min(200px, 26vh); }
  #hud .scrap { position: absolute; right: 18px; bottom: 16px; font: 700 14px/1 var(--font-ui); color: var(--chalk-2); text-shadow: 0 2px 10px rgb(7 8 11 / 0.8); }
  #wave { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); display: flex; gap: 12px; align-items: baseline; padding: 8px 16px;
    background: rgb(14 16 22 / 0.8); border-radius: var(--r-2); font: 600 14px/1 var(--font-ui); color: var(--chalk-2); }
  #wave b { font: 900 26px/1 var(--font-display); text-transform: uppercase; color: var(--chalk); }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 6vh 8vw;
    background: rgb(7 8 11 / 0.86); backdrop-filter: blur(8px); }
  #resultsList { display: flex; flex-direction: column; gap: 6px; max-width: 900px; }
  .standing { display: grid; grid-template-columns: minmax(180px, auto) 1fr 120px 120px; align-items: center; gap: 14px; padding: 10px 14px;
    background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r-2); }
  .standing .num { font: 800 22px/1 var(--font-display); text-align: right; }
  .standing .num small { font: 600 12px/1 var(--font-ui); color: var(--chalk-3); }
  .actions { display: flex; gap: 10px; }

  #callout { position: fixed; left: 0; right: 0; top: 34%; display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: none; opacity: 0; transition: opacity var(--t) var(--ease); }
  #callout.show { opacity: 1; }
  #callout .big { font: 900 clamp(64px, 10vw, 140px)/0.9 var(--font-display); text-transform: uppercase; text-align: center; text-shadow: 0 4px 24px rgb(7 8 11 / 0.7); }

  /* TVs (960x540 pages) */
  @media (max-height: 640px) {
    #lobby { grid-template-columns: 40% 1fr; }
    #lobby .side { padding: 20px 26px; gap: 14px; }
    .setting { font-size: 18px; padding: 9px 12px; }
    #lobby .join .qr { width: 72px; height: 72px; }
    .h1 { font-size: 44px; }
    .card { left: 12px; top: 12px; bottom: 12px; padding: 12px 14px; gap: 6px; }
    .card h2 { font-size: 32px; }
    .row { padding: 4px 8px; }
  }
</style>
</head>
<body>
  <canvas id="world"></canvas>

  <div id="lobby" class="hidden">
    <aside class="side">
      <button class="btn back" id="back"></button>
      <div>
        <span class="eyebrow">Action</span>
        <h1 class="h1" style="margin-top:10px">Shift <span class="hl-volt">Bots</span></h1>
        <p class="muted" style="margin:10px 0 0;max-width:38ch">Build a car that turns into a robot. Fight the horde together as robots; change back into a car to get away.</p>
      </div>
      <div><div class="caption" style="margin-bottom:10px">Your team</div><div id="players"></div></div>
      <div id="settings"></div>
      <p class="muted" id="terrainAbout" style="margin:0"></p>
      <div style="display:flex;gap:10px">
        <button id="start" class="btn btn-primary btn-lg"></button>
        <button id="howto" class="btn btn-lg"></button>
      </div>
      <div class="panel join">
        <div class="qr" id="qr"></div>
        <div><div class="caption">Scan to join · same Wi-Fi</div><div class="url" id="url">…</div></div>
      </div>
    </aside>
  </div>

  <div id="garage" class="hidden"><div id="bays"></div></div>
  <div id="hud" class="hidden"><div id="views"></div><div id="wave"></div><div id="boss" class="hidden">The Hauler<i><b></b></i></div></div>
  <div id="shop" class="hidden"><div id="shopViews"></div><div id="shopTime"></div></div>
  <div id="callout"></div>

  <div id="results" class="overlay hidden">
    <span class="eyebrow">Shift Bots · <span id="resultsWhere"></span></span>
    <h1 class="h1" id="resultsTitle"></h1>
    <div id="resultsList"></div>
    <div class="actions"><button class="btn btn-primary btn-lg" id="again"></button><button class="btn btn-lg" id="toGarage"></button></div>
  </div>

  <div id="pause" class="overlay hidden">
    <span class="eyebrow">Shift Bots</span>
    <h1 class="h1">Paused</h1>
    <div class="legend" id="pauseLegend"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
