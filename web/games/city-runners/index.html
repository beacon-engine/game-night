<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Runners · Beacon Arcade</title>
<link rel="icon" href="/brand/mark.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* ---- lobby: over a run going on behind ---- */
  #lobby { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(400px, 36%) 1fr; }
  #lobby .side { display: flex; flex-direction: column; gap: 22px; padding: 32px 40px; background: rgb(7 8 11 / 0.92); border-right: 1px solid var(--line); overflow-y: auto; }
  #lobby .back { align-self: flex-start; }
  #runners { display: flex; flex-direction: column; gap: 8px; }
  .runner { display: flex; align-items: center; gap: 12px; }
  #settings { display: flex; flex-direction: column; }
  .setting { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-left: 3px solid transparent;
    font: 700 22px/1 var(--font-display); text-transform: uppercase; color: var(--chalk-2); }
  .setting.sel { background: var(--ink-2); border-left-color: var(--volt); color: var(--chalk); }
  .setting .value { display: flex; align-items: center; gap: 10px; }
  .setting .value b { min-width: 3.6em; text-align: center; color: var(--chalk); }
  .setting:not(.sel) .glyph { visibility: hidden; }
  #record { font-size: 14px; }
  #lobby .join { display: flex; gap: 14px; align-items: center; padding: 12px; margin-top: auto; }
  #lobby .join .qr { width: 88px; height: 88px; padding: 5px; }
  #lobby .join .url { font: 600 13px/1.3 var(--font-ui); word-break: break-all; margin-top: 4px; }
  #lobby .help { position: absolute; right: 28px; bottom: 24px; padding: 12px 16px; }

  /* ---- running: everyone along the top, a tag over each runner ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #board { position: absolute; left: 18px; right: 18px; top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .lane { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 0; border-radius: var(--r-2); background: rgb(14 16 22 / 0.86); border: 1px solid var(--line); overflow: hidden; }
  .lane b { align-self: stretch; display: flex; align-items: center; padding: 0 10px; background: var(--pc); color: var(--ink-0); font: 700 13px/1 var(--font-ui); }
  .lane .m { font: 800 26px/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 3.2em; }
  .lane .m small { font: 600 12px/1 var(--font-ui); color: var(--chalk-2); margin-left: 3px; }
  .lane .coins { font: 600 13px/1 var(--font-ui); color: var(--chalk-2); font-variant-numeric: tabular-nums; }
  .lane .pw { display: flex; gap: 4px; }
  .lane .pw i { font: 700 10px/1 var(--font-ui); font-style: normal; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 6px; border-radius: 4px; color: var(--ink-0); }
  .lane .warn { font: 800 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.05em; color: #ff2d55; }
  .lane.out { opacity: 0.45; }
  .tag { position: absolute; transform: translate(-50%, -100%); padding: 3px 8px; border-radius: 4px; background: var(--pc); color: var(--ink-0);
    font: 700 12px/1 var(--font-ui); white-space: nowrap; }
  .tag.cpu { background: rgb(14 16 22 / 0.8); color: var(--chalk-2); border: 1px solid var(--pc); }

  #callout { position: fixed; left: 0; right: 0; top: 30%; display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: none; opacity: 0; transition: opacity var(--t) var(--ease); }
  #callout.show { opacity: 1; }
  #callout .big { font: 900 clamp(56px, 9vw, 130px)/0.9 var(--font-display); text-transform: uppercase; text-align: center; text-shadow: 0 4px 24px rgb(7 8 11 / 0.7); }

  /* ---- picking a look: a card per person ---- */
  #wardrobe { position: absolute; left: 18px; right: 18px; bottom: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .look { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; background: rgb(14 16 22 / 0.9); }
  .look .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 600 14px/1.2 var(--font-ui); }
  .look .row i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-strong); vertical-align: -3px; margin-right: 6px; }
  .look .ready { font: 800 20px/1 var(--font-display); text-transform: uppercase; color: var(--chalk-2); display: flex; align-items: center; gap: 8px; }
  .look .ready.on { color: var(--volt); }

  /* ---- results, pause ---- */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 6vh 8vw;
    background: rgb(7 8 11 / 0.86); backdrop-filter: blur(8px); }
  #standings { display: flex; flex-direction: column; gap: 4px; max-width: 900px; overflow-y: auto; }
  .standing { display: grid; grid-template-columns: 34px minmax(160px, auto) 1fr 90px 80px 90px; align-items: center; gap: 14px; padding: 8px 14px;
    background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r-2); }
  .standing.first { border-left: 3px solid var(--volt); }
  .standing > .num { font: 800 22px/1 var(--font-display); color: var(--chalk-3); }
  .standing .d { font: 800 22px/1 var(--font-display); text-align: right; font-variant-numeric: tabular-nums; }
  .standing .c, .standing .sc { font: 600 14px/1 var(--font-ui); text-align: right; color: var(--chalk-2); font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 10px; }

  /* TVs (960x540 pages) */
  @media (max-height: 640px) {
    #lobby { grid-template-columns: 40% 1fr; }
    #lobby .side { padding: 20px 26px; gap: 14px; }
    .setting { font-size: 18px; padding: 9px 12px; }
    #lobby .join .qr { width: 72px; height: 72px; }
    .h1 { font-size: 44px; }
    .lane .m { font-size: 20px; }
  }
  .tv .keys { display: none !important; }
</style>
</head>
<body>
  <canvas id="world"></canvas>

  <div id="lobby" class="hidden">
    <aside class="side">
      <button class="btn back" id="back"></button>
      <div>
        <span class="eyebrow">Arcade</span>
        <h1 class="h1" style="margin-top:10px">City <span class="hl-volt">Runners</span></h1>
        <p class="muted" style="margin:10px 0 0;max-width:36ch">Over the rooftops and along the rail line, all of you at once. Jump, slide, dodge, and stay ahead of the drone.</p>
      </div>
      <div><div class="caption" style="margin-bottom:10px">Runners</div><div id="runners"></div></div>
      <div id="settings"></div>
      <div class="faint" id="record"></div>
      <div style="display:flex;gap:10px">
        <button id="start" class="btn btn-primary btn-lg"></button>
        <button id="howto" class="btn btn-lg"></button>
      </div>
      <div class="panel join">
        <div class="qr" id="qr"></div>
        <div><div class="caption">Scan to join · same Wi-Fi</div><div class="url" id="url">…</div></div>
      </div>
    </aside>
    <div style="position:relative">
      <div class="panel panel-glass help legend" id="legend"></div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="tags"></div>
    <div id="board"></div>
    <div id="wardrobe"></div>
  </div>
  <div id="callout"></div>

  <div id="results" class="overlay hidden">
    <span class="eyebrow" id="resultsWhat"></span>
    <h1 class="h1" id="winner"></h1>
    <div id="standings"></div>
    <div class="actions">
      <button class="btn btn-primary btn-lg" id="again"></button>
      <button class="btn btn-lg" id="toLobby"></button>
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <span class="eyebrow">City Runners</span>
    <h1 class="h1">Paused</h1>
    <div class="legend" id="pauseLegend"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
