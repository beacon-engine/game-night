<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snakes and Ladders · Beacon Arcade</title>
<link rel="icon" href="/brand/mark.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #board { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* ---- lobby: the board on the right ---- */
  #lobby { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(400px, 36%) 1fr; pointer-events: none; }
  #lobby .side { display: flex; flex-direction: column; gap: 14px; padding: 24px 40px; background: rgb(7 8 11 / 0.92); border-right: 1px solid var(--line); overflow-y: auto; pointer-events: auto; }
  #lobby .back { align-self: flex-start; }
  #lobby .h1 { font-size: clamp(40px, 4.6vw, 64px); }
  #lobby .right { display: flex; flex-direction: column; gap: 14px; padding: 24px 32px; min-height: 0; }
  #lobbyBoard { flex: 1; }
  #lobby .foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; pointer-events: auto; }
  #lobbyAbout { text-align: right; max-width: 46ch; line-height: 1.6; }
  #players { display: flex; flex-direction: column; gap: 8px; }
  .who { display: flex; align-items: center; gap: 12px; }
  .who .chip { flex-shrink: 0; }
  #settings { display: flex; flex-direction: column; }
  .setting { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; border-left: 3px solid transparent;
    font: 700 20px/1 var(--font-display); text-transform: uppercase; color: var(--chalk-2); }
  #lobby .btn-lg { white-space: nowrap; }
  .setting.sel { background: var(--ink-2); border-left-color: var(--volt); color: var(--chalk); }
  .setting .value { display: flex; align-items: center; gap: 10px; }
  .setting .value b { min-width: 5.6em; text-align: center; color: var(--chalk); }
  .setting:not(.sel) .glyph { visibility: hidden; }
  #lobby .join { display: flex; gap: 14px; align-items: center; padding: 12px; max-width: 360px; }
  #lobby .join .qr { width: 88px; height: 88px; padding: 5px; }
  #lobby .join .url { font: 600 13px/1.3 var(--font-ui); word-break: break-all; margin-top: 4px; }

  /* ---- the race: the board on the left, the turn order and the die on the right ---- */
  #hud { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 330px; gap: 24px; padding: 24px; pointer-events: none; }
  #side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  #seats { display: flex; flex-direction: column; gap: 8px; }
  .seat { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 10px 14px 10px 12px;
    background: var(--ink-1); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--r-2); }
  .seat.turn { background: var(--ink-2); border-left-color: var(--volt); }
  .seat.done { opacity: 0.7; }
  .seat .disc { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--pc);
    border: 3px solid var(--ink-0); box-shadow: 0 0 0 2px var(--pc); font: 900 22px/1 var(--font-display); color: var(--ink-0); }
  .seat .name { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .seat .name b { font: 800 24px/1 var(--font-display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seat .name .caption { font-size: 11px; }
  .seat.turn .name .caption { color: var(--volt); }
  .seat .where { font: 900 40px/1 var(--font-display); text-align: right; min-width: 2.2em; }
  .seat .where small { display: block; font: 600 11px/1 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk-3); margin-bottom: 3px; }
  .seat.done .where { color: var(--volt); }
  #dieBox { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: auto; }
  #dieArea { width: 100%; height: 170px; }
  #dieNote { min-height: 2.4em; text-align: center; font: 800 24px/1.1 var(--font-display); text-transform: uppercase; }
  #dieNote .sub { display: block; font: 600 13px/1.4 var(--font-ui); letter-spacing: 0.1em; color: var(--chalk-2); }
  #rulesLine { font-size: 12px; text-align: center; color: var(--chalk-3); }

  #callout { position: fixed; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 12px; text-align: center;
    background: rgb(7 8 11 / 0.86); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    pointer-events: none; opacity: 0; transition: opacity var(--t) var(--ease); }
  #callout.show { opacity: 1; }
  #callout .big { font: 900 clamp(48px, 7vw, 104px)/0.9 var(--font-display); text-transform: uppercase; }
  #callout .line { font: 700 22px/1.1 var(--font-display); text-transform: uppercase; color: var(--chalk-2); }

  /* ---- results, pause ---- */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 6vh 8vw;
    background: rgb(7 8 11 / 0.88); backdrop-filter: blur(8px); }
  #standings { display: flex; flex-direction: column; gap: 6px; max-width: 820px; }
  .standing { display: grid; grid-template-columns: 54px auto 1fr auto; align-items: center; gap: 14px; padding: 10px 14px; background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r-2); }
  .standing.first { border-left: 3px solid var(--volt); }
  .standing > .place { font: 900 30px/1 var(--font-display); text-transform: uppercase; color: var(--chalk-2); }
  .standing.first > .place { color: var(--volt); }
  .standing > b { font: 800 24px/1 var(--font-display); text-transform: uppercase; }
  .actions { display: flex; gap: 10px; }

  /* TVs (960x540 pages) */
  @media (max-height: 640px) {
    #lobby { grid-template-columns: 40% 1fr; }
    #lobby .side { padding: 16px 26px; gap: 10px; }
    #lobby .right { padding: 14px 18px; gap: 10px; }
    #lobby .h1 { font-size: 38px; white-space: nowrap; }
    #lobby .intro { display: none; }
    #lobby .btn-lg { padding-inline: 16px; }
    .setting { font-size: 17px; padding: 8px 12px; }
    #lobby .join .qr { width: 72px; height: 72px; }
    .h1 { font-size: 44px; }
    #hud { grid-template-columns: 1fr 260px; gap: 14px; padding: 14px; }
    .seat { grid-template-columns: 34px 1fr auto; padding: 7px 10px; gap: 9px; }
    .seat .disc { width: 30px; height: 30px; font-size: 17px; }
    .seat .name b { font-size: 19px; }
    .seat .where { font-size: 30px; }
    #dieArea { height: 120px; }
    #dieNote { font-size: 19px; }
  }
  .tv .keys { display: none !important; }
</style>
</head>
<body>
  <canvas id="board"></canvas>

  <div id="lobby" class="hidden">
    <aside class="side">
      <button class="btn back" id="back"><span class="glyph glyph-drop" title="Drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.4 6.2 7.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.5 6.2-10.9z"/></svg></span> Games</button>
      <div>
        <span class="eyebrow">Board</span>
        <h1 class="h1" style="margin-top:10px">Snakes and <span class="hl-volt">Ladders</span></h1>
        <p class="muted intro" style="margin:8px 0 0;max-width:34ch">Climb the ladders, dodge the snakes. First one home wins.</p>
      </div>
      <div><div class="caption" style="margin-bottom:10px">Players</div><div id="players"></div></div>
      <div id="settings"></div>
      <div style="display:flex;gap:10px">
        <button id="start" class="btn btn-primary btn-lg"><span class="glyph glyph-bolt" title="Bolt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span> Start</button>
        <button id="howto" class="btn btn-lg"><span class="glyph glyph-star" title="Star"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 16.9l-5.4 2.9 1-6.1-4.4-4.3 6.1-.8z"/></svg></span> How to play</button>
      </div>
    </aside>
    <div class="right">
      <div id="lobbyBoard"></div>
      <div class="foot">
        <div class="panel join">
          <div class="qr" id="qr"></div>
          <div><div class="caption">Scan to join · same Wi-Fi</div><div class="url" id="url">…</div></div>
        </div>
        <div id="lobbyAbout" class="caption"></div>
      </div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="boardArea"></div>
    <div id="side">
      <div class="caption">Turn order</div>
      <div id="seats"></div>
      <div id="dieBox">
        <div id="dieArea"></div>
        <div id="dieNote"></div>
      </div>
      <div id="rulesLine"></div>
    </div>
  </div>
  <div id="callout"></div>

  <div id="results" class="overlay hidden">
    <span class="eyebrow">Finishing order</span>
    <h1 class="h1" id="winner"></h1>
    <div id="standings"></div>
    <div class="actions">
      <button class="btn btn-primary btn-lg" id="rematch"><span class="glyph glyph-bolt" title="Bolt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span> Play again</button>
      <button class="btn btn-lg" id="toLobby"><span class="glyph glyph-drop" title="Drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.4 6.2 7.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.5 6.2-10.9z"/></svg></span> Lobby</button>
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <span class="eyebrow">Snakes and Ladders</span>
    <h1 class="h1">Paused</h1>
    <div class="legend"><span><span class="glyph glyph-bolt" title="Bolt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span> Resume</span><span><span class="glyph glyph-drop" title="Drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.4 6.2 7.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.5 6.2-10.9z"/></svg></span> Quit to the lobby</span></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
