<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool · Beacon Arcade</title>
<link rel="icon" href="/brand/mark.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #table { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* ---- lobby: the table turning slowly on the right ---- */
  #lobby { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(400px, 36%) 1fr; pointer-events: none; }
  #lobby .side { display: flex; flex-direction: column; gap: 22px; padding: 32px 40px; background: rgb(7 8 11 / 0.92); border-right: 1px solid var(--line); overflow-y: auto; pointer-events: auto; }
  #lobby .back { align-self: flex-start; }
  #players { display: flex; flex-direction: column; gap: 8px; }
  .who { display: flex; align-items: center; gap: 12px; }
  #settings { display: flex; flex-direction: column; }
  .setting { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-left: 3px solid transparent;
    font: 700 22px/1 var(--font-display); text-transform: uppercase; color: var(--chalk-2); }
  .setting.sel { background: var(--ink-2); border-left-color: var(--volt); color: var(--chalk); }
  .setting.off { opacity: 0.35; }
  .setting .value { display: flex; align-items: center; gap: 10px; }
  .setting .value b { min-width: 6.4em; text-align: center; color: var(--chalk); }
  .setting:not(.sel) .glyph { visibility: hidden; }
  #lobby .join { display: flex; gap: 14px; align-items: center; padding: 12px; margin-top: auto; }
  #lobby .join .qr { width: 88px; height: 88px; padding: 5px; }
  #lobby .join .url { font: 600 13px/1.3 var(--font-ui); word-break: break-all; margin-top: 4px; }
  #sound { position: fixed; top: 20px; right: 24px; }

  /* ---- in a frame: the scoreboard on top, the meters bottom left, help bottom right ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #board { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: 300px auto 300px; gap: 10px; align-items: stretch; }
  .card { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px; background: rgb(14 16 22 / 0.86); border: 1px solid var(--line); border-top: 3px solid var(--line); border-radius: var(--r-2); }
  .card.turn { border-top-color: var(--volt); background: rgb(22 25 34 / 0.92); }
  .card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .frames { font: 900 34px/1 var(--font-display); }
  .card .group { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 18px; }
  .card.turn .group .caption { color: var(--volt); }
  #mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; min-width: 120px; }
  #potted { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 160px; }
  .pips { display: flex; gap: 3px; }
  .pip { width: 15px; height: 15px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.35); }
  .pip.stripe { background: linear-gradient(#f4f1e6 26%, var(--c) 26% 74%, #f4f1e6 74%); }
  .pip.down { opacity: 0.18; }
  #status { position: absolute; top: 112px; left: 0; right: 0; text-align: center; font: 700 22px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; }

  #meters { position: absolute; left: 24px; bottom: 22px; display: flex; align-items: flex-end; gap: 16px; padding: 12px 16px; }
  #spin { position: relative; width: 74px; height: 74px; border-radius: 50%; background: #f4f1e6; box-shadow: inset -6px -8px 14px rgb(0 0 0 / 0.25); }
  #spin::before { content: ''; position: absolute; inset: 20%; border-radius: 50%; border: 1px dashed rgb(0 0 0 / 0.25); }
  #spinDot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #c8202b; border: 2px solid #fff; transition: left 80ms, top 80ms; }
  .meter { display: flex; flex-direction: column; gap: 8px; width: 300px; }
  .meter .row { display: flex; justify-content: space-between; align-items: baseline; }
  #power { height: 14px; background: var(--ink-3); border-radius: var(--r-1); overflow: hidden; }
  #powerFill { height: 100%; width: 0; background: var(--bolt); }
  #powerText { font: 800 22px/1 var(--font-display); }
  #spinName { color: var(--chalk); }
  #legend { position: absolute; right: 24px; bottom: 24px; max-width: 520px; justify-content: flex-end; }

  #callout { position: fixed; left: 0; right: 0; top: 38%; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 12px; text-align: center;
    background: rgb(7 8 11 / 0.82); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    pointer-events: none; opacity: 0; transition: opacity var(--t) var(--ease); }
  #callout.show { opacity: 1; }
  #callout .big { font: 900 clamp(44px, 6vw, 92px)/0.9 var(--font-display); text-transform: uppercase; }
  #callout .line { font: 700 22px/1.1 var(--font-display); text-transform: uppercase; color: var(--chalk-2); }

  /* ---- results, pause ---- */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 6vh 8vw;
    background: rgb(7 8 11 / 0.88); backdrop-filter: blur(8px); }
  #standings { display: flex; flex-direction: column; gap: 6px; max-width: 760px; }
  .standing { display: grid; grid-template-columns: auto 50px 1fr auto; align-items: center; gap: 14px; padding: 10px 14px; background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r-2); }
  .standing.first { border-left: 3px solid var(--volt); }
  .standing > b { font: 800 24px/1 var(--font-display); text-transform: uppercase; }
  .actions { display: flex; gap: 10px; }
  #pauseRows { display: flex; flex-direction: column; max-width: 520px; }

  /* TVs (960x540 pages) */
  @media (max-height: 640px) {
    #lobby { grid-template-columns: 44% 1fr; }
    #lobby .side { padding: 20px 26px; gap: 14px; }
    .setting { font-size: 18px; padding: 9px 12px; }
    #lobby .join .qr { width: 72px; height: 72px; }
    .h1 { font-size: 44px; }
    #board { grid-template-columns: 250px auto 250px; top: 10px; }
    .card .frames { font-size: 28px; }
    .pip { width: 12px; height: 12px; }
    #status { top: 92px; font-size: 18px; }
    .meter { width: 220px; }
    #spin { width: 60px; height: 60px; }
    #legend { display: none; }
  }
  .tv .keys { display: none !important; }
</style>
</head>
<body>
  <canvas id="table"></canvas>

  <div id="lobby" class="hidden">
    <aside class="side">
      <button class="btn back" id="back"><span class="glyph glyph-drop" title="Drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.4 6.2 7.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.5 6.2-10.9z"/></svg></span> Games</button>
      <div>
        <span class="eyebrow">Sports</span>
        <h1 class="h1" style="margin-top:10px"><span class="hl-volt">Pool</span></h1>
        <p class="muted" style="margin:10px 0 0;max-width:34ch">8-ball on a proper table. Line it up, choose the power and the spin, and take turns.</p>
      </div>
      <div><div class="caption" style="margin-bottom:10px">Players</div><div id="players"></div></div>
      <div id="settings"></div>
      <div style="display:flex;gap:10px">
        <button id="start" class="btn btn-primary btn-lg"><span class="glyph glyph-bolt" title="Bolt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span> Start</button>
        <button id="howto" class="btn btn-lg"><span class="glyph glyph-star" title="Star"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 16.9l-5.4 2.9 1-6.1-4.4-4.3 6.1-.8z"/></svg></span> How to play</button>
      </div>
      <div class="panel join">
        <div class="qr" id="qr"></div>
        <div><div class="caption">Scan to join · same Wi-Fi</div><div class="url" id="url">…</div></div>
      </div>
    </aside>
  </div>
  <div id="sound" class="caption over-pitch hidden">Click anywhere for sound</div>

  <div id="hud" class="hidden">
    <div id="board">
      <div class="card" id="card0"></div>
      <div id="mid"><span class="caption" id="match"></span><div id="potted"></div></div>
      <div class="card" id="card1"></div>
    </div>
    <div id="status" class="over-pitch"></div>
    <div id="meters" class="panel-glass hidden">
      <div id="spin"><div id="spinDot"></div></div>
      <div class="meter">
        <div class="row"><span class="caption">Spin · <span id="spinName">Centre</span></span></div>
        <div class="row"><span class="caption">Power</span><span id="powerText" class="num"></span></div>
        <div id="power"><div id="powerFill"></div></div>
      </div>
    </div>
    <div class="legend over-pitch" id="legend"></div>
  </div>
  <div id="callout"></div>

  <div id="results" class="overlay hidden">
    <span class="eyebrow" id="why"></span>
    <h1 class="h1" id="winner"></h1>
    <div id="standings"></div>
    <div class="actions">
      <button class="btn btn-primary btn-lg" id="rematch"><span class="glyph glyph-bolt" title="Bolt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span> Rematch</button>
      <button class="btn btn-lg" id="toLobby"><span class="glyph glyph-drop" title="Drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.4 6.2 7.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.5 6.2-10.9z"/></svg></span> Lobby</button>
    </div>
    <p class="faint" style="margin:0">Rematch: the other player breaks first.</p>
  </div>

  <div id="pause" class="overlay hidden">
    <span class="eyebrow">Pool</span>
    <h1 class="h1">Paused</h1>
    <div id="pauseRows"></div>
    <div class="legend" id="pauseLegend"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
