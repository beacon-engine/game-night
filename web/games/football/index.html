<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football · Beacon Arcade</title>
<link rel="icon" href="/brand/mark.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* type over the pitch needs a little help to stay readable */
  .over-pitch { text-shadow: 0 2px 12px rgb(7 8 11 / 0.6); }

  /* ---- scoreboard ---- */
  #scoreboard { position: fixed; top: 20px; left: 24px; display: flex; align-items: stretch; height: 44px; overflow: hidden; }
  #scoreboard > * { display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  #scoreboard .team { font: 800 24px/1 var(--font-display); letter-spacing: 0.04em; }
  #scoreboard .kit { width: 4px; height: 24px; border-radius: 1px; }
  #score { font: 800 26px/1 var(--font-display); background: var(--ink-2); border-inline: 1px solid var(--line); min-width: 84px; justify-content: center; }
  #clock { font: 600 15px/1 var(--font-ui); color: var(--chalk-2); border-left: 1px solid var(--line); min-width: 74px; justify-content: center; }

  /* ---- banner ---- */
  #banner { position: fixed; left: 0; right: 0; top: 34%; display: flex; flex-direction: column; align-items: center; gap: 14px;
    pointer-events: none; opacity: 0; transition: opacity var(--t) var(--ease); }
  #banner.show { opacity: 1; }
  #banner .big { font: 900 clamp(80px, 12vw, 168px)/0.85 var(--font-display); text-transform: uppercase; letter-spacing: 0.01em;
    text-shadow: 0 4px 24px rgb(7 8 11 / 0.55); animation: in .35s var(--ease); }
  #banner .small { font: 800 34px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; padding: 12px 22px;
    background: rgb(14 16 22 / 0.86); border: 1px solid var(--line); border-left: 3px solid var(--volt); border-radius: var(--r-2); animation: in .25s var(--ease); }
  #banner .sub { font: 500 18px/1.3 var(--font-ui); color: var(--chalk); padding: 8px 14px; background: rgb(14 16 22 / 0.8); border-radius: var(--r-2); }
  #banner .card { display: inline-block; width: 0.5em; height: 0.7em; border-radius: 4px; margin-right: 0.3em; vertical-align: -0.04em; }
  #banner .card.yellow { background: var(--warn); }
  #banner .card.red { background: var(--bad); }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* ---- players on the pitch ---- */
  #chips { position: fixed; left: 24px; top: 76px; display: flex; flex-direction: column; gap: 6px; }
  .hud-row { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; row-gap: 6px; align-items: center;
    width: 290px; padding: 8px 12px 10px 0; border-radius: var(--r-2); overflow: hidden; }
  .hud-row .tag { grid-row: span 2; align-self: stretch; height: auto; border: 0; border-radius: 0; color: var(--ink-0); font-size: 12px; font-weight: 700; padding: 0 10px; }
  .hud-row .who { font: 600 14px/1.2 var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud-row .stats { grid-column: 2; font: 600 10px/1 var(--font-ui); letter-spacing: 0.08em; color: var(--chalk-2); }
  .hud-row .bars { grid-column: 2; display: flex; gap: 6px; }
  .hud-row .sta, .hud-row .bar { height: 4px; background: var(--ink-3); border-radius: 1px; overflow: hidden; }
  .hud-row .sta { flex: 1; } .hud-row .bar { flex: 2; }
  .hud-row .sta > div, .hud-row .bar > div { height: 100%; width: 0; }
  .hud-row .bar > div { background: var(--volt); }

  #radar { position: fixed; right: 24px; top: 20px; border-radius: var(--r-2); }

  /* ---- lobby ---- */
  #lobby { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(420px, 36%) 1fr; }
  #lobby .side { display: flex; flex-direction: column; gap: 26px; padding: 36px 44px; background: rgb(7 8 11 / 0.92); border-right: 1px solid var(--line); overflow-y: auto; }
  #lobby .back { align-self: flex-start; display: flex; align-items: center; gap: 10px; }
  .teams { display: flex; flex-direction: column; gap: 10px; }
  .team-row { padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: center; }
  .team-row .caption { grid-column: 1 / -1; display: flex; justify-content: space-between; }
  .club { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .club .name { font: 800 34px/0.95 var(--font-display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kitbig { width: 22px; height: 34px; border-radius: var(--r-1); flex: none; box-shadow: inset 0 0 0 1px rgb(243 240 232 / 0.25); }
  .arrows { display: flex; gap: 6px; }
  .club.sel .name { color: var(--volt); } /* a cursor is on the club row */
  .cur { display: flex; gap: 4px; flex: none; }
  /* the team sheet: shape, keeper and instructions, two to a row */
  .plan { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
  .prow { display: flex; flex-direction: column; gap: 3px; padding: 5px 8px; border-left: 3px solid transparent; cursor: pointer; min-width: 0; }
  .prow .caption { display: flex; align-items: center; gap: 6px; }
  .prow b { font: 600 14px/1.2 var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow.sel { background: var(--ink-2); border-left-color: var(--volt); }
  .prow .arr, .mi .arr { color: var(--volt); padding: 0 6px; }
  .ptag { font: 700 10px/1 var(--font-ui); color: var(--ink-0); padding: 2px 4px; border-radius: var(--r-1); }
  .pnote { grid-column: 1 / -1; font-size: 12px; color: var(--chalk-2); padding: 2px 8px; }
  .humans { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; align-items: center; }
  .humans em { font-style: normal; font-size: 13px; color: var(--chalk-3); }
  .vs { align-self: center; font: 800 18px/1 var(--font-display); color: var(--chalk-3); letter-spacing: 0.2em; }
  .actions { display: flex; gap: 10px; }
  #lobby .join { display: flex; gap: 16px; align-items: center; padding: 14px; margin-top: auto; }
  #lobby .join .qr { width: 96px; height: 96px; padding: 6px; }
  #lobby .join .url { font: 600 14px/1.3 var(--font-ui); word-break: break-all; margin-top: 4px; }
  #lobby .stage { position: relative; }
  #help { position: absolute; right: 28px; bottom: 28px; width: min(640px, calc(100% - 56px)); padding: 18px 20px; }
  #help h4 { margin: 0 0 12px; }

  /* ---- controls table (lobby + pause) ---- */
  .ctl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .ctl-col h4 { margin: 0 0 8px; }
  .ctl-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; }
  .swipe { font: 700 9px/1 var(--font-ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--volt-ink); background: var(--volt); padding: 3px 5px; border-radius: var(--r-1); }
  .ctl-note { margin-top: 14px; font-size: 13px; color: var(--chalk-3); }
  .ctl-note code { color: var(--chalk-2); font-size: 12px; }

  /* ---- pause ---- */
  #pause { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 40px 6vw;
    background: rgb(7 8 11 / 0.86); backdrop-filter: blur(10px) saturate(1.1); animation: fade .18s var(--ease); }
  @keyframes fade { from { opacity: 0; } }
  #pHead { display: flex; align-items: center; gap: 22px; }
  .ps-team { display: flex; align-items: center; gap: 12px; font: 800 30px/1 var(--font-display); text-transform: uppercase; }
  .ps-team .kit { width: 6px; height: 30px; border-radius: 1px; }
  .ps-score { font: 900 48px/1 var(--font-display); display: flex; align-items: baseline; gap: 12px; }
  .ps-score i { font-style: normal; color: var(--chalk-3); }
  .ps-score small { font: 600 13px/1 var(--font-ui); color: var(--chalk-2); letter-spacing: 0.1em; margin-left: 6px; }
  .pbody { display: grid; grid-template-columns: 340px minmax(0, 640px); gap: 48px; align-items: start; }
  .pleft { display: flex; flex-direction: column; gap: 4px; }
  .pleft .h1 { margin-bottom: 4px; }
  #pausedBy { margin-bottom: 18px; }
  #pMenu { display: flex; flex-direction: column; }
  .mi { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 16px; cursor: pointer;
    font: 700 24px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; color: var(--chalk-2);
    border-left: 3px solid transparent; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .mi em { font: 600 11px/1 var(--font-ui); font-style: normal; letter-spacing: 0.12em; text-transform: uppercase; color: var(--chalk-3); }
  .mi:hover { color: var(--chalk); }
  .mi.sel { color: var(--chalk); background: var(--ink-2); border-left-color: var(--volt); }
  .mi.sel em { color: var(--volt); }
  .pright { display: flex; flex-direction: column; gap: 14px; }
  #pStats { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .pst { display: grid; grid-template-columns: 52px 1fr 110px 1fr 52px; align-items: center; gap: 12px; }
  .pst > b { font: 800 22px/1 var(--font-display); text-align: center; }
  .pst > span { text-align: center; }
  .pbar { height: 4px; background: var(--ink-3); display: flex; justify-content: flex-end; border-radius: 1px; overflow: hidden; }
  .pbar.r { justify-content: flex-start; }
  .pbar i { display: block; height: 100%; background: var(--home, var(--chalk)); }
  .pbar.r i { background: var(--away, var(--chalk-2)); }
  .pside { padding: 18px 20px; }
  .pside h3 { margin: 0 0 12px; }
  .pside p { margin: 0 0 14px; color: var(--chalk-2); }
  .pside .confirm { display: flex; gap: 10px; }
  .pside .confirm .mi { min-width: 110px; justify-content: center; border: 1px solid var(--line); border-left-width: 3px; }
  #pHelp { color: var(--chalk-2); }
  .pside .mi.tac { font-size: 20px; padding: 9px 14px; }
  .pside .mi.tac em { font-size: 13px; }
  .pside .tnote { margin: 10px 0 6px; font-size: 13px; }

  /* ---- substitutions ---- */
  #subs { padding: 18px 20px; }
  #subs .shead { display: flex; justify-content: space-between; margin-bottom: 12px; }
  #subs .scols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  #subs h4 { margin: 0 0 8px; }
  #subs .srow { display: flex; align-items: center; gap: 10px; padding: 6px 10px; font-size: 14px; border-left: 3px solid transparent; }
  #subs .srow b { width: 22px; font: 800 18px/1 var(--font-display); color: var(--chalk-2); }
  #subs .srow em { font-style: normal; width: 34px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: var(--chalk-3); }
  #subs .srow small { margin-left: auto; font-size: 11px; color: var(--chalk-3); }
  #subs .srow.sel { background: var(--ink-2); border-left-color: var(--volt); }
  #subs .srow.sel b { color: var(--volt); }
  #subs .srow.off { text-decoration: line-through; opacity: 0.5; }
  #subs .srow.no { opacity: 0.35; }
  #subs .sbar { margin-left: auto; width: 64px; height: 4px; background: var(--ink-3); border-radius: 1px; overflow: hidden; }
  #subs .sbar i { display: block; height: 100%; }

  #sound { position: fixed; top: 20px; right: 24px; }

  @media (max-width: 1000px) {
    #lobby { grid-template-columns: 1fr; }
    #lobby .stage { display: none; }
    .pbody { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="scoreboard" class="panel panel-glass hidden">
    <div class="team"><span class="kit" id="kitH"></span><span id="nameH">HOM</span></div>
    <div id="score" class="num">0 - 0</div>
    <div class="team"><span id="nameA">AWY</span><span class="kit" id="kitA"></span></div>
    <div id="clock" class="num">00:00</div>
  </div>
  <div id="banner"></div>
  <div id="chips"></div>
  <canvas id="radar" width="232" height="146" class="panel panel-glass hidden"></canvas>

  <div id="lobby" class="hidden">
    <aside class="side">
      <button class="btn back" id="back"><span class="glyph glyph-drop" title="Drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.4 6.2 7.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.5 6.2-10.9z"/></svg></span> Games</button>
      <div>
        <span class="eyebrow">Football</span>
        <h1 class="h1" style="margin-top:12px">Pick your <span class="hl-volt">sides</span></h1>
      </div>

      <div class="teams">
        <div class="panel team-row">
          <div class="caption"><span>Home</span><span class="faint">▲▼ choose · ◀ ▶ change</span></div>
          <div class="club" id="clubH"><span class="kitbig" id="lkitH"></span><span class="name" id="lnameH"></span><span class="cur" id="curH"></span></div>
          <div class="arrows"><button class="btn btn-icon" data-team="0" data-d="-1">◀</button><button class="btn btn-icon" data-team="0" data-d="1">▶</button></div>
          <div class="plan" id="planH"></div>
          <div class="humans" id="humansH"></div>
        </div>
        <div class="vs">VS</div>
        <div class="panel team-row">
          <div class="caption"><span>Away</span><span class="faint"><span class="glyph glyph-leaf" title="Leaf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19.5C5 11 10 5 20 4c-.6 9.8-6.6 15.5-15 15.5z"/><path d="M5 19.5 13 11.5"/></svg></span> swaps side</span></div>
          <div class="club" id="clubA"><span class="kitbig" id="lkitA"></span><span class="name" id="lnameA"></span><span class="cur" id="curA"></span></div>
          <div class="arrows"><button class="btn btn-icon" data-team="1" data-d="-1">◀</button><button class="btn btn-icon" data-team="1" data-d="1">▶</button></div>
          <div class="plan" id="planA"></div>
          <div class="humans" id="humansA"></div>
        </div>
      </div>

      <div class="actions">
        <button id="start" class="btn btn-primary btn-lg"><span class="glyph glyph-bolt" title="Bolt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span> Kick off</button>
        <button id="tod" class="btn btn-lg">Day</button>
        <button id="howto" class="btn btn-lg"><span class="glyph glyph-star" title="Star"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 16.9l-5.4 2.9 1-6.1-4.4-4.3 6.1-.8z"/></svg></span> How to play</button>
      </div>

      <div class="panel join">
        <div class="qr" id="qr"></div>
        <div>
          <div class="caption">Scan to join · same Wi-Fi</div>
          <div class="url" id="url">…</div>
          <div class="caption faint" style="margin-top:6px">Turn the phone sideways</div>
        </div>
      </div>
    </aside>
    <div class="stage">
      <div id="help" class="panel panel-glass"></div>
    </div>
  </div>

  <div id="pause" class="hidden">
    <div id="pHead"></div>
    <div class="pbody">
      <div class="pleft">
        <div class="h1">Paused</div>
        <div id="pausedBy" class="caption"></div>
        <div id="pMenu"></div>
      </div>
      <div class="pright">
        <div id="pStats" class="panel"></div>
        <div id="pSide" class="pside panel hidden"></div>
        <div id="subs" class="panel hidden"></div>
      </div>
    </div>
    <div id="pHelp" class="legend"></div>
  </div>
  <div id="sound" class="caption over-pitch">Click anywhere for sound</div>

  <script type="module" src="main.js"></script>
</body>
</html>
