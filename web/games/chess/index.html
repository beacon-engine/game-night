<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess · Beacon Arcade</title>
<link rel="icon" href="/brand/mark.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #board { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* ---- lobby: the board on the right ---- */
  #lobby { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(400px, 36%) 1fr; pointer-events: none; }
  #lobby .side { display: flex; flex-direction: column; gap: 22px; padding: 32px 40px; background: rgb(7 8 11 / 0.92); border-right: 1px solid var(--line); overflow-y: auto; pointer-events: auto; }
  #lobby .back { align-self: flex-start; }
  #lobbyBoard { margin: 32px; }
  #players { display: flex; flex-direction: column; gap: 8px; }
  .who { display: flex; align-items: center; gap: 12px; }
  #settings { display: flex; flex-direction: column; }
  .setting { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-left: 3px solid transparent;
    font: 700 22px/1 var(--font-display); text-transform: uppercase; color: var(--chalk-2); }
  .setting.sel { background: var(--ink-2); border-left-color: var(--volt); color: var(--chalk); }
  .setting.off { opacity: 0.35; }
  .setting .value { display: flex; align-items: center; gap: 10px; }
  .setting .value b { min-width: 4.6em; text-align: center; color: var(--chalk); }
  .setting:not(.sel) .glyph { visibility: hidden; }
  #lobby .join { display: flex; gap: 14px; align-items: center; padding: 12px; margin-top: auto; }
  #lobby .join .qr { width: 88px; height: 88px; padding: 5px; }
  #lobby .join .url { font: 600 13px/1.3 var(--font-ui); word-break: break-all; margin-top: 4px; }

  /* ---- in a game: players left, the board in the middle, the moves right ---- */
  #hud { position: fixed; inset: 0; display: grid; grid-template-columns: 250px 1fr 230px; gap: 24px; padding: 24px; pointer-events: none; }
  #cards { display: flex; flex-direction: column; justify-content: space-between; gap: 16px; }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: var(--ink-1); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: var(--r-2); }
  .card.turn { background: var(--ink-2); border-left-color: var(--volt); }
  .card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .clock { font: 800 44px/1 var(--font-display); }
  .card .clock.low { color: var(--bad); }
  .card .note { min-height: 1em; color: var(--chalk-2); }
  .card.turn .note { color: var(--volt); }
  .taken { display: flex; flex-wrap: wrap; align-items: center; min-height: 24px; }
  .taken .piece { width: 24px; height: 24px; margin-right: -7px; }
  .taken .lead { margin-left: 12px; font: 600 14px/1 var(--font-ui); color: var(--chalk-2); }
  #side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  #moves { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .mv { display: grid; grid-template-columns: 34px 1fr 1fr; gap: 6px; padding: 4px 8px; font: 600 16px/1.3 var(--font-ui); color: var(--chalk-2); }
  .mv:nth-child(odd) { background: var(--ink-1); }
  .mv b { color: var(--chalk); }
  #side .legend { margin-top: auto; flex-direction: column; align-items: flex-start; gap: 8px; font-size: 13px; }

  #callout { position: fixed; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 12px; text-align: center;
    background: rgb(7 8 11 / 0.86); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    pointer-events: none; opacity: 0; transition: opacity var(--t) var(--ease); }
  #callout.show { opacity: 1; }
  #callout .big { font: 900 clamp(48px, 7vw, 104px)/0.9 var(--font-display); text-transform: uppercase; }
  #callout .line { font: 700 22px/1.1 var(--font-display); text-transform: uppercase; color: var(--chalk-2); }

  /* ---- results, pause, a draw offer ---- */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 6vh 8vw;
    background: rgb(7 8 11 / 0.88); backdrop-filter: blur(8px); }
  #standings { display: flex; flex-direction: column; gap: 6px; max-width: 760px; }
  .standing { display: grid; grid-template-columns: auto 80px 1fr auto; align-items: center; gap: 14px; padding: 10px 14px; background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r-2); }
  .standing.first { border-left: 3px solid var(--volt); }
  .standing > b { font: 800 24px/1 var(--font-display); text-transform: uppercase; }
  .actions { display: flex; gap: 10px; }
  #pauseRows { display: flex; flex-direction: column; max-width: 460px; }

  /* TVs (960x540 pages) */
  @media (max-height: 640px) {
    #lobby { grid-template-columns: 40% 1fr; }
    #lobby .side { padding: 20px 26px; gap: 14px; }
    #lobbyBoard { margin: 16px; }
    .setting { font-size: 18px; padding: 9px 12px; }
    #lobby .join .qr { width: 72px; height: 72px; }
    .h1 { font-size: 44px; }
    #hud { grid-template-columns: 210px 1fr 190px; gap: 14px; padding: 16px; }
    .card { padding: 10px 12px; gap: 6px; }
    .card .clock { font-size: 34px; }
    .mv { font-size: 14px; padding: 3px 6px; }
  }
  .tv .keys { display: none !important; }
</style>
</head>
<body>
  <canvas id="board"></canvas>

  <div id="lobby" class="hidden">
    <aside class="side">
      <button class="btn back" id="back"><span class="glyph glyph-drop" title="Drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.4 6.2 7.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.5 6.2-10.9z"/></svg></span> Games</button>
      <div>
        <span class="eyebrow">Board</span>
        <h1 class="h1" style="margin-top:10px"><span class="hl-volt">Chess</span></h1>
        <p class="muted" style="margin:10px 0 0;max-width:34ch">The classic. Play a friend on the same screen, or take on the computer.</p>
      </div>
      <div><div class="caption" style="margin-bottom:10px">Players</div><div id="players"></div></div>
      <div id="settings"></div>
      <div style="display:flex;gap:10px">
        <button id="start" class="btn btn-primary btn-lg"><span class="glyph glyph-bolt" title="Bolt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span> Start</button>
        <button id="howto" class="btn btn-lg"><span class="glyph glyph-star" title="Star"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 16.9l-5.4 2.9 1-6.1-4.4-4.3 6.1-.8z"/></svg></span> How to play</button>
      </div>
      <div class="panel join">
        <div class="qr" id="qr"></div>
        <div><div class="caption">Scan to join · same Wi-Fi</div><div class="url" id="url">…</div></div>
      </div>
    </aside>
    <div id="lobbyBoard"></div>
  </div>

  <div id="hud" class="hidden">
    <div id="cards"><div class="card" id="topCard"></div><div class="card" id="bottomCard"></div></div>
    <div id="boardArea"></div>
    <div id="side">
      <div class="caption">Moves</div>
      <div id="moves"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>
  <div id="callout"></div>

  <div id="results" class="overlay hidden">
    <span class="eyebrow" id="why"></span>
    <h1 class="h1" id="winner"></h1>
    <div id="standings"></div>
    <div class="actions">
      <button class="btn btn-primary btn-lg" id="rematch"><span class="glyph glyph-bolt" title="Bolt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span> Rematch</button>
      <button class="btn btn-lg" id="toLobby"><span class="glyph glyph-drop" title="Drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.4 6.2 7.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.5 6.2-10.9z"/></svg></span> Lobby</button>
    </div>
    <p class="faint" style="margin:0">Rematch swaps colours.</p>
  </div>

  <div id="pause" class="overlay hidden">
    <span class="eyebrow">Chess</span>
    <h1 class="h1">Paused</h1>
    <div id="pauseRows"></div>
    <div class="legend" id="pauseLegend"></div>
  </div>

  <div id="offer" class="overlay hidden">
    <span class="eyebrow">Draw offer</span>
    <h1 class="h1" id="offerTitle"></h1>
    <div class="legend" id="offerLegend"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
