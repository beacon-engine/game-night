<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07080b">
<title>Beacon Arcade Pad</title>
<link rel="icon" href="/brand/mark.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  :root { --accent: var(--volt); --me: var(--chalk); }
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none;
  }

  /* --- top bar: who you are, what you're playing ------------------------------------- */
  #bar {
    position: fixed; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; gap: 12px; z-index: 2;
    padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
    background: var(--ink-1); border-bottom: 1px solid var(--line);
  }
  #bar::after { content: ''; position: absolute; left: 0; bottom: -1px; width: 120px; height: 2px; background: var(--accent); }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
  #dot.on { background: var(--good); }
  #me { background: var(--me); color: var(--ink-0); border-radius: var(--r-1); padding: 4px 8px; font: 700 13px/1 var(--font-ui); letter-spacing: .04em; }
  #title { font: 700 20px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stars { margin-left: auto; height: 32px; gap: 6px; }
  #stars:empty { display: none; }
  #name { height: 32px; }
  #stars:empty + #name { margin-left: auto; }
  #pause { height: 32px; width: 44px; padding: 0; letter-spacing: 0; }
  #hint { position: fixed; top: 60px; left: 0; right: 0; text-align: center; pointer-events: none; }

  /* --- stick: floating, appears where the thumb lands -------------------------------- */
  #stick-zone { position: fixed; left: 0; top: 48px; bottom: 0; width: 50%; }
  #stick-base, #stick-knob { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
  #stick-base { width: 150px; height: 150px; border: 1px solid var(--line-strong); background: rgb(243 240 232 / .03); transition: border-color var(--t-fast) var(--ease); }
  #stick-base::after { content: ''; position: absolute; inset: 24px; border-radius: 50%; border: 1px dashed var(--line); }
  #stick-base.sprint { border: 2px solid var(--volt); }
  #stick-knob { width: 64px; height: 64px; background: var(--chalk); }
  #stick-help { position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; line-height: 1.8; }

  /* --- buttons: the diamond (Star top, Drop right, Bolt bottom, Leaf left) and shoulders */
  #buttons { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: 14px; width: 282px; height: 270px; }
  .pb, .sh {
    position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: var(--ink-1); border: 1px solid var(--line-strong);
    transition: transform 60ms var(--ease), background var(--t-fast) var(--ease), opacity var(--t) var(--ease);
  }
  .pb { width: 88px; height: 88px; border-radius: 50%; }
  .pb .sym { font: 300 38px/1 var(--font-ui); color: var(--c); }
  .pb .sym svg { width: 34px; height: 34px; display: block; }
  .sh { top: 4px; width: 88px; height: 44px; border-radius: var(--r-2); }
  .sh .sym { font: 700 13px/1 var(--font-ui); letter-spacing: .06em; }
  .lbl { font: 600 9px/1.1 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--chalk-2); max-width: 80px; text-align: center; }
  .pb.down, .sh.down { transform: scale(.95); border-color: var(--c, var(--chalk)); background: color-mix(in srgb, var(--c, var(--chalk)) 22%, var(--ink-1)); }
  .unused { opacity: .25; } /* buttons the game doesn't use right now */
  #bT { right: 96px; top: 0; --c: var(--star); }
  #bO { right: 0; top: 90px; --c: var(--drop); }
  #bX { right: 96px; top: 180px; --c: var(--bolt); }
  #bS { right: 192px; top: 90px; --c: var(--leaf); }
  #bL1 { left: 0; } #bR1 { right: 0; }

  /* --- d-pad (menus, grid games): one tap, one step ----------------------------------- */
  #dpad { position: fixed; left: max(28px, env(safe-area-inset-left)); bottom: 28px; width: 260px; height: 260px;
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 6px; }
  .dp { display: flex; align-items: center; justify-content: center; background: var(--ink-1); border: 1px solid var(--line-strong);
    border-radius: var(--r-2); font: 400 30px/1 var(--font-ui); color: var(--chalk);
    transition: transform 60ms var(--ease), background var(--t-fast) var(--ease); }
  .dp.down { transform: scale(.94); border-color: var(--volt); background: color-mix(in srgb, var(--volt) 18%, var(--ink-1)); }
  .dp[data-dir=up] { grid-area: 1 / 2; } .dp[data-dir=left] { grid-area: 2 / 1; }
  .dp[data-dir=right] { grid-area: 2 / 3; } .dp[data-dir=down] { grid-area: 3 / 2; }
  #dpad .hub { grid-area: 2 / 2; border-radius: 50%; margin: 18px; border: 1px dashed var(--line); }

  /* --- racing: slide to steer, pedals on the right --------------------------------------- */
  #pedals { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: 14px; display: grid;
    grid-template-columns: repeat(4, 1fr); grid-template-rows: 46px auto; gap: 8px; width: 300px; }
  #pedals .mini { height: 46px; width: auto; position: static; }
  #pedals .pedal { position: static; grid-row: 2; width: auto; height: 190px; border-radius: var(--r-2); justify-content: flex-end; padding-bottom: 14px;
    background: repeating-linear-gradient(0deg, transparent 0 14px, rgb(243 240 232 / .05) 14px 16px), var(--ink-1); }
  #pedals .pedal.brake { grid-column: 1 / 3; height: 150px; align-self: end; }
  #pedals .pedal.throttle { grid-column: 3 / 5; }
  #pedals .pedal .sym { font-size: 26px; }
  #pedals .pedal .sym svg, .sh .sym svg { width: 22px; height: 22px; display: block; }
  #pedals .pedal .lbl { font-size: 11px; }
  body[data-layout=racing] #stick-base { width: 220px; height: 64px; border-radius: 32px; }
  body[data-layout=racing] #stick-base::after { inset: 8px 60px; border-radius: 24px; }

  /* which controls each layout shows */
  #dpad, #pedals { display: none; }
  body[data-layout=dpad] #dpad, body[data-layout=racing] #pedals { display: grid; }
  body[data-layout=dpad] #stick-zone, body[data-layout=racing] #buttons { display: none; }

  #power { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: 292px; width: 282px; height: 6px; border-radius: var(--r-1); background: var(--ink-2); border: 1px solid var(--line); overflow: hidden; display: none; }
  #power > div { height: 100%; width: 0; background: var(--volt); }

  /* --- overlays -------------------------------------------------------------------------- */
  #overlay, #rotate {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: var(--ink-0); z-index: 4; text-align: center; padding: 24px;
  }
  #ov-text { font: 800 34px/1 var(--font-display); text-transform: uppercase; }
  #ov-shop { margin-top: 10px; gap: 8px; }
  #ov-text small { display: block; margin-top: 10px; font: 500 15px/1.4 var(--font-ui); text-transform: none; color: var(--chalk-2); }
  #rotate { display: none; z-index: 6; font: 800 30px/1.1 var(--font-display); text-transform: uppercase; }
  @media (orientation: portrait) { #rotate { display: flex; } }

  /* --- stars: "+15" when a game pays out, and the shop ------------------------------------ */
  #earned { position: fixed; top: 58px; left: 50%; transform: translate(-50%, -8px); z-index: 3; padding: 8px 14px; border-radius: var(--r-2);
    background: var(--ink-2); border: 1px solid var(--coin); font: 800 20px/1 var(--font-display); text-transform: uppercase;
    opacity: 0; pointer-events: none; transition: opacity var(--t) var(--ease), transform var(--t) var(--ease); }
  #earned.show { opacity: 1; transform: translate(-50%, 0); }
  #shop { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; background: var(--ink-0); }
  #shop.open { display: flex; }
  #shop header { display: flex; align-items: center; gap: 14px; height: 52px; flex: none;
    padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); border-bottom: 1px solid var(--line); background: var(--ink-1); }
  #shop header h2 { margin: 0; font: 800 22px/1 var(--font-display); text-transform: uppercase; }
  #shop header .stars-count { font-size: 18px; }
  #shop-close { margin-left: auto; height: 34px; }
  #shop-list { flex: 1; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    padding: 12px max(14px, env(safe-area-inset-right)) 24px max(14px, env(safe-area-inset-left)); user-select: none; }
  #shop-list h3 { margin: 14px 0 8px; font: 600 11px/1 var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-2); }
  #shop-list .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .item { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px;
    background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r-2); }
  .item .swatch { width: 40px; height: 40px; border-radius: var(--r-1); background: var(--sw, var(--ink-3)); border: 1px solid var(--line-strong); }
  .item b { display: block; font: 700 15px/1.2 var(--font-ui); }
  .item small { display: block; margin-top: 3px; font: 500 12px/1.3 var(--font-ui); color: var(--chalk-2); }
  .item .buy { height: 34px; min-width: 76px; }
  .item .buy.sure { background: var(--coin); color: var(--ink-0); border-color: var(--coin); }
  .item.owned .buy { opacity: .6; }
  #shop-msg { min-height: 1.2em; margin: 4px 0 0; }
</style>
</head>
<body data-layout="stick">
  <div id="bar">
    <div id="dot"></div>
    <div id="me">P?</div>
    <div id="title">Connecting…</div>
    <button class="btn" id="stars" aria-label="Your stars: open the shop"></button>
    <button class="btn" id="name">Set name</button>
    <button class="btn" id="pause" aria-label="Pause">❚❚</button>
  </div>
  <div id="hint" class="caption"></div>

  <div id="stick-zone">
    <div id="stick-help" class="caption faint">Touch &amp; drag to move<br>past the ring to sprint</div>
    <div id="stick-base" hidden></div>
    <div id="stick-knob" hidden></div>
  </div>

  <div id="dpad">
    <div class="dp" data-dir="up">▲</div><div class="dp" data-dir="left">◀</div><div class="hub"></div>
    <div class="dp" data-dir="right">▶</div><div class="dp" data-dir="down">▼</div>
  </div>

  <div id="pedals">
    <div class="sh mini" data-button="leaf" style="--c:var(--leaf)"><span class="sym" style="color:var(--leaf)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19.5C5 11 10 5 20 4c-.6 9.8-6.6 15.5-15 15.5z"/><path d="M5 19.5 13 11.5"/></svg></span><span class="lbl"></span></div>
    <div class="sh mini" data-button="star" style="--c:var(--star)"><span class="sym" style="color:var(--star)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 16.9l-5.4 2.9 1-6.1-4.4-4.3 6.1-.8z"/></svg></span><span class="lbl"></span></div>
    <div class="sh mini" data-button="l1"><span class="sym">L1</span><span class="lbl"></span></div>
    <div class="sh mini" data-button="r1"><span class="sym">R1</span><span class="lbl"></span></div>
    <div class="pb pedal brake" data-button="drop" style="--c:var(--drop)"><span class="sym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.4 6.2 7.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.5 6.2-10.9z"/></svg></span><span class="lbl"></span></div>
    <div class="pb pedal throttle" data-button="bolt" style="--c:var(--bolt)"><span class="sym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span><span class="lbl"></span></div>
  </div>

  <div id="power"><div></div></div>
  <div id="buttons">
    <div class="sh" id="bL1" data-button="l1"><span class="sym">L1</span><span class="lbl"></span></div>
    <div class="sh" id="bR1" data-button="r1"><span class="sym">R1</span><span class="lbl"></span></div>
    <div class="pb" id="bT" data-button="star"><span class="sym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 16.9l-5.4 2.9 1-6.1-4.4-4.3 6.1-.8z"/></svg></span><span class="lbl"></span></div>
    <div class="pb" id="bO" data-button="drop"><span class="sym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.4 6.2 7.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.5 6.2-10.9z"/></svg></span><span class="lbl"></span></div>
    <div class="pb" id="bX" data-button="bolt"><span class="sym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span><span class="lbl"></span></div>
    <div class="pb" id="bS" data-button="leaf"><span class="sym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19.5C5 11 10 5 20 4c-.6 9.8-6.6 15.5-15 15.5z"/><path d="M5 19.5 13 11.5"/></svg></span><span class="lbl"></span></div>
  </div>

  <div id="earned"></div>
  <div id="shop">
    <header>
      <h2>Shop</h2><span id="shop-balance"></span>
      <button class="btn" id="shop-close">Done</button>
    </header>
    <div id="shop-list"></div>
  </div>

  <div id="overlay" class="grid-bg">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 16.9l-5.4 2.9 1-6.1-4.4-4.3 6.1-.8z"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19.5C5 11 10 5 20 4c-.6 9.8-6.6 15.5-15 15.5z"/><path d="M5 19.5 13 11.5"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.4 6.2 7.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.5 6.2-10.9z"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span>
    <div id="ov-text">Connecting…</div>
    <span class="caption faint">Tap to go full screen</span>
    <button class="btn" id="ov-shop" hidden>Shop</button>
  </div>
  <div id="rotate" class="grid-bg"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 16.9l-5.4 2.9 1-6.1-4.4-4.3 6.1-.8z"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19.5C5 11 10 5 20 4c-.6 9.8-6.6 15.5-15 15.5z"/><path d="M5 19.5 13 11.5"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.4 6.2 7.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0c0-3.3 2.6-6.5 6.2-10.9z"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span>Turn your phone sideways</div>

<script type="module" src="main.js"></script>
</body>
</html>
