<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Night</title>
<link rel="icon" href="/brand/mark.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-columns: minmax(380px, 38%) 1fr; overflow: hidden; }

  /* --- left: what's selected, and how to join ------------------------------ */
  .side { display: flex; flex-direction: column; gap: 28px; padding: 40px 48px; border-right: 1px solid var(--line); min-height: 0; }
  .feature { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .feature .h1 { font-size: clamp(56px, 6.4vw, 104px); overflow-wrap: anywhere; }
  #fIcon { width: 64px; height: 64px; background: var(--volt); -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  #fIcon.soon { background: var(--chalk-2); }
  #fTitle { color: var(--volt); }
  #fTitle.soon { color: var(--chalk); }
  .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #fTagline { font-size: 18px; color: var(--chalk-2); max-width: 30ch; margin: 0; }
  .feature .btn { align-self: flex-start; margin-top: 8px; }
  .feature .btn:disabled { background: transparent; border-color: var(--line-strong); color: var(--chalk-3); cursor: default; }

  .join { display: flex; gap: 18px; align-items: center; padding: 16px; }
  .join .url { font: 600 15px/1.3 var(--font-ui); color: var(--chalk); word-break: break-all; margin: 4px 0 10px; }
  .join .chips em { font-style: normal; font-size: 13px; color: var(--chalk-3); }

  /* --- right: the library --------------------------------------------------- */
  .library { overflow-y: auto; padding: 40px 48px 120px; scroll-padding: 40px; }
  .section + .section { margin-top: 40px; }
  .section header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .section header .rule { flex: 1; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }

  .tile {
    aspect-ratio: 1;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 14px; text-align: left; color: inherit; font: inherit; cursor: pointer;
    background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r-2);
    transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
  }
  .tile:hover { border-color: var(--line-strong); }
  .tile.sel { background: var(--ink-2); border-color: var(--line-strong); }
  .tile .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .tile .icon { width: 40px; height: 40px; background: var(--chalk-2); -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  .tile .emoji { font-size: 32px; line-height: 40px; }
  .tile.ready .icon { background: var(--volt); }
  .tile.sel .icon { background: var(--chalk); }
  .tile.ready.sel .icon { background: var(--volt); }
  .tile .name { font: 700 24px/0.95 var(--font-display); text-transform: uppercase; }
  .tile.soon .name { color: var(--chalk-2); }
  .tile.unsupported { opacity: .45; }
  .tile.unsupported .icon { background: var(--chalk-3); }
  #fWhy { margin: 0; font-size: 15px; color: var(--warn); max-width: 34ch; }
  #fWhy:empty { display: none; }
  .tile.sel .name { color: var(--chalk); }

  .hints { position: fixed; left: 38%; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center;
    padding: 14px 48px; background: linear-gradient(transparent, var(--ink-0) 40%); pointer-events: none; }

  #banner { position: fixed; left: 50%; bottom: 72px; transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    transition: opacity var(--t) var(--ease), transform var(--t) var(--ease); padding: 12px 18px; }
  #banner.show { opacity: 1; transform: translate(-50%, 0); }

  /* TVs: a 1080p TV is a 960x540 page (Android TV renders at 2x). Keep it all on one screen. */
  @media (max-height: 640px) and (min-width: 901px) {
    body { grid-template-columns: 34% 1fr; }
    .side { padding: 24px 28px; gap: 16px; }
    .wordmark { font-size: 22px; gap: 10px; }
    .wordmark .mark { width: 22px; height: 22px; }
    .feature { gap: 10px; }
    .feature .h1 { font-size: clamp(36px, 5.6vw, 60px); }
    #fIcon { width: 40px; height: 40px; }
    #fTagline, #fWhy { font-size: 14px; }
    .feature .btn-lg { height: 44px; font-size: 13px; padding: 0 18px; }
    .join { padding: 10px; gap: 12px; }
    .join .qr { width: 84px; height: 84px; padding: 5px; }
    .join .url { font-size: 13px; margin: 2px 0 6px; }
    .library { padding: 24px 28px 90px; }
    .section + .section { margin-top: 24px; }
    .section header { margin-bottom: 10px; }
    .tiles { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
    .tile { padding: 10px; }
    .tile .icon, .tile .emoji { width: 28px; height: 28px; font-size: 24px; line-height: 28px; }
    .tile .name { font-size: 17px; }
    .hints { left: 34%; padding: 10px 28px; }
    .hints .caption { font-size: 10px; }
    .legend { font-size: 12px; gap: 6px 14px; }
  }
  /* in the TV app: the remote and phones, no keyboard */
  .tv .keys { display: none !important; }

  @media (max-width: 900px) {
    body { display: block; overflow: auto; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 24px 20px; }
    .library { overflow: visible; padding: 24px 20px 80px; }
    .tiles { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .hints { left: 0; padding: 12px 20px; }
  }
</style>
</head>
<body>
  <aside class="side grid-bg">
    <div class="wordmark"><span class="mark"><i></i><i></i><i></i><i></i></span><span>Game <span class="outline">Night</span></span></div>

    <section class="feature">
      <span id="fIcon"></span>
      <span class="eyebrow">Tonight's game</span>
      <h1 class="h1" id="fTitle">…</h1>
      <p id="fTagline"></p>
      <div class="meta"><span class="tag" id="fPlayers"></span><span class="tag" id="fStatus"></span></div>
      <p id="fWhy"></p>
      <button class="btn btn-primary btn-lg" id="play"></button>
    </section>

    <section class="join panel">
      <div class="qr" id="qr"></div>
      <div>
        <div class="caption">Scan to join · same Wi-Fi</div>
        <div class="url" id="url">…</div>
        <div class="chips" id="players"></div>
      </div>
    </section>
  </aside>

  <main class="library" id="library"></main>

  <div class="hints">
    <div class="legend" id="legend"></div>
    <span class="caption faint" style="text-align:right"><span id="device"></span><br><span id="version"></span></span>
  </div>
  <div id="banner" class="panel caption"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
